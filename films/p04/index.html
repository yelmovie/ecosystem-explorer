:root{--paper:#fffef7;--grid:#dce4d5;--ink:#203f34;--forest:#175c47;--leaf:#e3eecb;--amber:#d9951a;--muted:#61746a}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;background:var(--paper);overflow:hidden}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"NanumSquareNeo",sans-serif;color:var(--ink);word-break:keep-all}
#paper{position:absolute;inset:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:60px 60px;background-position:30px 30px;opacity:.9}
#paper::after{content:"";position:absolute;left:150px;top:0;bottom:0;width:4px;background:#efc35680}
#head{position:absolute;left:96px;top:56px;z-index:50}
#head-i{display:inline-block;font-size:30px;font-weight:700;color:var(--forest);letter-spacing:.02em}
#question{position:absolute;left:96px;top:104px;width:1300px;z-index:50}
#question-i{font-size:72px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
#stage{position:absolute;inset:0;z-index:10}
.part{position:absolute}
.art{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(32,63,52,.22))}
.plate{width:100%;height:100%;border-radius:28px;overflow:hidden;border:8px solid #fff;box-shadow:0 14px 30px rgba(32,63,52,.22);background:#fff}
.plate img{display:block;width:100%;height:100%;object-fit:cover}
.anchor{width:0;height:0}
.center{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.tag{white-space:nowrap;padding:12px 26px;border-radius:18px;background:#fff;border:4px solid var(--ink);font-weight:800;line-height:1.25;box-shadow:0 8px 0 rgba(32,63,52,.16)}
.tag.accent{border-color:var(--amber);background:#fff6dc}
.tag small{display:block;font-size:max(28px,.72em);font-weight:700;color:var(--muted)}
.heading{white-space:nowrap;font-weight:800;line-height:1.2}
.stamp{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:4px 18px;border-radius:12px;background:var(--ink);color:#fff;font-size:30px;font-weight:800;white-space:nowrap}
.phase{display:inline-block;padding:8px 22px;border-radius:14px;background:var(--leaf);color:var(--forest);font-size:34px;font-weight:800}
.moa{position:absolute;right:40px;bottom:0;width:400px;height:620px;z-index:60}
.moa img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:bottom center;transform-origin:50% 100%}
